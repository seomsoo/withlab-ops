<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WithLab favicon">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="432" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f9ff"/>
    </linearGradient>

    <linearGradient id="wLeft" x1="112" y1="96" x2="250" y2="418" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b49ff"/>
      <stop offset="0.48" stop-color="#176cff"/>
      <stop offset="1" stop-color="#35b7ff"/>
    </linearGradient>

    <linearGradient id="wMid" x1="222" y1="100" x2="303" y2="414" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d63ff"/>
      <stop offset="0.55" stop-color="#0b4ee8"/>
      <stop offset="1" stop-color="#0736b8"/>
    </linearGradient>

    <linearGradient id="wRight" x1="262" y1="98" x2="411" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#73d7ff"/>
      <stop offset="0.5" stop-color="#35aaff"/>
      <stop offset="1" stop-color="#1974ff"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0c3f91" flood-opacity="0.18"/>
    </filter>

    <clipPath id="appMask">
      <rect x="32" y="32" width="448" height="448" rx="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#appMask)">
    <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
    <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#eef5ff" stroke-width="2"/>

    <g filter="url(#softShadow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M128 142 L203 360" stroke="url(#wLeft)" stroke-width="72"/>
      <path d="M203 360 L259 200" stroke="url(#wMid)" stroke-width="72"/>
      <path d="M259 200 L328 360" stroke="url(#wRight)" stroke-width="72"/>
      <path d="M328 360 L394 142" stroke="url(#wRight)" stroke-width="72"/>
    </g>

    <path d="M257 201 L318 342" fill="none" stroke="#5ac9ff" stroke-opacity="0.28" stroke-width="72" stroke-linecap="round"/>
  </g>
</svg>
